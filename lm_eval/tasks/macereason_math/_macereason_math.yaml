tag:
  - math_word_problems
dataset_path: ahmedselhady/mAceReason-Math
process_docs: !function utils.process_docs
output_type: generate_until
training_split: train
fewshot_split: null
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{answer if few_shot is undefined else solution}}"
process_results: !function utils.process_results
generation_kwargs:
  until:
    - "Problem:"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 2048
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
num_fewshot: 5
fewshot_config:
  sampler: first_n
  samples: !function utils.list_fewshot_samples
metadata:
  version: 1.0
